<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
<script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <title>Poem Generator</title>
  </head>
  <body>
    <div class="container">
      
    <h1>Poem Generator</h1>
    <div class="form-container">
    <form id="poem-form">
      <input
        type="text"
        placeholder="Generate a poem about wanderlust"
        required
        autofocus
        autocomplete="off"
        class="input-field"
        id="input-field"
      />
      <input type="submit"  class="submit-button"/>
    </form>
    <div class="hint">i.e valleys, mountains, oceans</div>
    </div>
    <div class="poem hidden" id="poem">
      <p></p>
    
</div>
    <script src="src/index.js"></script>
  </body>
  <footer>
    This project was coded by
    <a href="https://github.com/Ontibile-ai" target="_blank">Ontibile Mmusi</a>
    and is open sourced on
    <a href="https://github.com/Ontibile-ai/Poem-Generator" target="_blank"
      >GitHub</a
    >
    and hosted on
    <a href="https://poemgeneratorom.netlify.app/" target="_blank">Netlify</a>.
  </footer>
</div>
</html>
